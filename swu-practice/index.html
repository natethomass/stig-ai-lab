<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vader Sealed Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 42 13.5v21L24 45 6 34.5v-21z' fill='none' stroke='%23f2b705' stroke-width='3'/%3E%3Cpath d='M15 31 33 17' stroke='%23c0392b' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<header class="topbar">
  <div class="title">
    <div class="brandmark">
      <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f2b705"/><stop offset="1" stop-color="#c0392b"/>
          </linearGradient>
        </defs>
        <path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="none" stroke="url(#em)" stroke-width="2.5"/>
        <path d="M15 31 33 17" stroke="url(#em)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="17" cy="18" r="2.2" fill="#f2b705"/>
        <circle cx="24" cy="24" r="2.2" fill="#f2b705"/>
        <circle cx="31" cy="30" r="2.2" fill="#c0392b"/>
      </svg>
      <div>
        <h1>Vader Sealed <span class="sub">A Lawless Time</span> <span class="pilot" id="pilot" hidden></span></h1>
        <p class="deckline" id="deckline">
          <span class="asp Aggression">Aggression</span>
          <span class="asp Villainy">Villainy</span>
          <span class="asp Cunning">Cunning</span>
          <span class="dl-cards"><span class="dl-sep">·</span> Darth Vader — Unstoppable
            <span class="dl-sep">·</span> Partisan Hideout</span>
        </p>
      </div>
    </div>
  </div>
  <div class="controls">
    <label>Opponent
      <select id="difficulty">
        <option value="padawan">Padawan</option>
        <option value="standard" selected>Standard</option>
        <option value="sith">Sith</option>
      </select>
    </label>
    <button id="new-game" class="btn primary">New game</button>
    <button id="show-deck" class="btn">Decklist</button>
    <button id="show-settings" class="btn">Settings</button>
  </div>
</header>

<main class="layout">
  <section class="board">
    <div class="side enemy">
      <div class="side-head">
        <span class="who">Opponent</span>
        <span class="chip" id="ai-deckname"></span>
        <span class="chip" id="ai-hand">Hand 0</span>
        <span class="chip" id="ai-deck">Deck 0</span>
        <span class="chip" id="ai-discard">Discard 0</span>
        <span class="chip" id="ai-res">Resources 0</span>
      </div>
      <div class="side-main">
        <div class="basebox" id="ai-base"></div>
        <div class="leaderbox" id="ai-leader"></div>
      </div>
    </div>

    <div class="arena" data-arena="space">
      <div class="arena-label">Space arena</div>
      <div class="row" id="ai-space"></div>
      <div class="row mine" id="you-space"></div>
    </div>

    <div class="arena" data-arena="ground">
      <div class="arena-label">Ground arena</div>
      <div class="row" id="ai-ground"></div>
      <div class="row mine" id="you-ground"></div>
    </div>

    <div class="side you">
      <div class="side-main">
        <div class="basebox" id="you-base"></div>
        <div class="leaderbox" id="you-leader"></div>
      </div>
      <div class="side-head">
        <span class="who" id="me-label">You</span>
        <span class="chip" id="you-deck">Deck 0</span>
        <span class="chip" id="you-discard">Discard 0</span>
        <span class="chip" id="you-res">Resources 0</span>
        <span class="chip" id="you-credits">Credits 0</span>
      </div>
    </div>

    <div class="hand-area">
      <div class="hand-label">Your hand</div>
      <div class="hand" id="you-hand"></div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="status" id="status"></div>
    <div class="prompt" id="prompt" hidden></div>
    <div class="actions" id="actions"></div>
    <div class="logbox">
      <div class="log-label">Game log</div>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<div class="win-overlay" id="win-overlay" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <button class="btn close" id="modal-close">Close</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/prefs.js"></script>
<script src="js/art.js"></script>
<script src="js/cards.js"></script>
<script src="js/opponent-deck.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
