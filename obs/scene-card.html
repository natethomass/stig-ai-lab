<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene Card — STIG AI Lab</title>
<link rel="stylesheet" href="theme.css">
<style>
  .card { position: absolute; inset: 0; display: grid; place-content: center;
          justify-items: start; gap: 0; padding: 0 var(--safe); }
  .num {
    font-family: var(--mono); font-size: 240px; font-weight: 800; line-height: 0.82;
    letter-spacing: -0.06em;
    -webkit-text-stroke: 2px rgba(0, 224, 138, 0.55); color: transparent;
    opacity: .9;
  }
  h1 { margin-top: 18px; font-size: 92px; font-weight: 800; letter-spacing: -0.035em;
       line-height: 1.02; max-width: 1300px;
       background: linear-gradient(100deg, #fff 24%, var(--brand) 90%);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 24px; font-size: 26px; color: var(--dim); max-width: 980px; line-height: 1.5; }
  .rule { margin: 34px 0 30px; width: 520px; }
  .fade { animation: fadeOut .6s ease-in .01s both; }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ?bg=clear — a translucent slab for laying over a screen share */
  body.clear .stage { background: rgba(8, 11, 16, 0.82); }
  body.clear .stage::before { opacity: .5; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sweep"></div>
  <div class="card">
    <div class="num rise" data-p="num">03</div>
    <h1 class="rise" style="animation-delay:.08s" data-p="title">The approval gate</h1>
    <div class="rule rise" style="animation-delay:.14s"></div>
    <p class="sub rise" style="animation-delay:.18s" data-p="sub">Every proposed Ansible task gets reviewed by a human before a single file is touched.</p>
    <div class="pipe rise" id="pipe" style="animation-delay:.24s; margin-top:34px"></div>
  </div>
</div>

<script src="params.js"></script>
<script src="pipeline.js"></script>
<script>
  bindText({
    num:   P('num', '03'),
    title: P('title', 'The approval gate'),
    sub:   P('sub', 'Every proposed Ansible task gets reviewed by a human before a single file is touched.')
  });

  if (P('bg', 'solid') === 'clear') document.body.classList.add('clear');
  if (P('pipe', 'on') === 'off') document.getElementById('pipe').style.display = 'none';
  else renderPipe(document.getElementById('pipe'), PN('step', 3));

  /* ?hold=6 fades the card out after 6s (use as a transition stinger). 0 = stay up. */
  var hold = PN('hold', 0);
  if (hold > 0) setTimeout(function () {
    document.getElementById('stage').classList.add('fade');
  }, hold * 1000);
</script>
</body>
</html>
