<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topic Bar — STIG AI Lab</title>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  .bar {
    position: absolute; top: 40px; left: var(--safe); right: var(--safe);
    display: flex; align-items: center; gap: 22px;
    padding: 14px 16px 14px 22px;
    border: 1px solid var(--line); border-radius: 999px;
    background: linear-gradient(100deg, rgba(10, 14, 20, 0.92), rgba(16, 24, 34, 0.78));
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    animation: riseIn .7s cubic-bezier(.16,1,.3,1) both;
  }

  .rec { display: flex; align-items: center; gap: 10px; flex: none;
         font-family: var(--mono); font-size: 14px; letter-spacing: .22em;
         text-transform: uppercase; color: var(--cat1); }
  .rec .t { color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: .1em; }

  .sep { width: 1px; height: 26px; background: var(--line); flex: none; }

  .topic { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 14px; }
  .topic .n { font-family: var(--mono); font-size: 14px; letter-spacing: .2em;
              text-transform: uppercase; color: var(--brand); flex: none; }
  .topic .txt { font-size: 25px; font-weight: 600; letter-spacing: -0.01em;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pipe-mini { flex: none; }
</style>
</head>
<body>
  <div class="bar">
    <div class="rec" id="rec"><span class="dot"></span> rec <span class="t" id="elapsed">00:00:00</span></div>
    <div class="sep"></div>
    <div class="topic">
      <div class="n" data-p="chapter">Ch 03</div>
      <div class="txt" data-p="topic">Hardening the homelab, end to end</div>
    </div>
    <div class="sep"></div>
    <div class="pipe-mini" id="pipe"></div>
  </div>

<script src="params.js"></script>
<script src="pipeline.js"></script>
<script>
  bindText({
    chapter: P('chapter', 'Ch 03'),
    topic:   P('topic', 'Hardening the homelab, end to end')
  });

  if (P('rec', 'on') === 'off') document.getElementById('rec').style.display = 'none';
  if (P('pipe', 'on') === 'off') {
    document.getElementById('pipe').previousElementSibling.style.display = 'none';
    document.getElementById('pipe').style.display = 'none';
  } else {
    renderPipeMini(document.getElementById('pipe'), PN('step', 3));
  }

  /* Elapsed time since this source loaded — refresh the source to reset. */
  var t0 = Date.now(), el = document.getElementById('elapsed');
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
      .map(function (v) { return String(v).padStart(2, '0'); }).join(':');
  }, 500);
</script>
</body>
</html>
