<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lower Third — STIG AI Lab</title>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  /* Transparent overlay — no .stage here. */
  .lt {
    position: absolute;
    display: flex; align-items: stretch;
    filter: drop-shadow(0 24px 50px rgba(0, 0, 0, 0.55));
    animation: wipeIn .85s cubic-bezier(.16,1,.3,1) both;
  }
  .lt.bl { left: var(--safe); bottom: 150px; }
  .lt.br { right: var(--safe); bottom: 150px; }
  .lt.tl { left: var(--safe); top: 120px; }
  .lt.tr { right: var(--safe); top: 120px; }
  .lt.out { animation: wipeOut .5s cubic-bezier(.6,0,.8,0) both; }

  .accent { width: 8px; background: linear-gradient(180deg, var(--brand), var(--brand-2)); }

  .body {
    background: linear-gradient(100deg, rgba(10, 14, 20, 0.94), rgba(16, 24, 34, 0.86));
    backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-left: none;
    border-radius: 0 var(--r-md) var(--r-md) 0;
    padding: 22px 40px 24px 30px;
    min-width: 560px;
  }
  .body .name { font-size: 50px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .body .role {
    margin-top: 10px;
    font-family: var(--mono); font-size: 19px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--brand);
  }
  .body .meta {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.1em; color: var(--mute);
  }
  .body .meta:empty { display: none; }
</style>
</head>
<body>
  <div class="lt bl" id="lt">
    <div class="accent"></div>
    <div class="body">
      <div class="name" data-p="name">Nate Thomas</div>
      <div class="role" data-p="role">TechFitDad</div>
      <div class="meta" data-p="meta">Homelab · Security+ · IT career</div>
    </div>
  </div>

<script src="params.js"></script>
<script>
  bindText({
    name: P('name', 'Nate Thomas'),
    role: P('role', 'TechFitDad'),
    meta: P('meta', 'Homelab · Security+ · IT career')
  });

  var lt = document.getElementById('lt');
  lt.className = 'lt ' + P('pos', 'bl');

  /* Auto-hide after ?dur seconds. dur=0 keeps it on screen. */
  var dur = PN('dur', 8);
  if (dur > 0) setTimeout(function () { lt.classList.add('out'); }, dur * 1000);
</script>
</body>
</html>
