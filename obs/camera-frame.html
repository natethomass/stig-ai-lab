<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera Frame — STIG AI Lab</title>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  /* Size this browser source to match your webcam source exactly, then place
     it directly on top. The middle stays cut out so the camera shows through. */
  .frame { position: absolute; inset: 0; border: 1px solid rgba(122, 200, 255, 0.16);
           border-radius: var(--r-md); box-shadow: inset 0 0 60px var(--brand-faint); }

  .corner { position: absolute; width: 38px; height: 38px; border: 3px solid var(--brand);
           filter: drop-shadow(0 0 8px var(--brand-glow)); }
  .corner.tl { top: -1px; left: -1px;  border-right: none; border-bottom: none;
               border-radius: var(--r-md) 0 0 0; }
  .corner.tr { top: -1px; right: -1px; border-left: none;  border-bottom: none;
               border-radius: 0 var(--r-md) 0 0; }
  .corner.bl { bottom: -1px; left: -1px;  border-right: none; border-top: none;
               border-radius: 0 0 0 var(--r-md); }
  .corner.br { bottom: -1px; right: -1px; border-left: none;  border-top: none;
               border-radius: 0 0 var(--r-md) 0; }

  .tag {
    position: absolute; left: 14px; bottom: 14px;
    display: flex; align-items: center; gap: 9px;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(8, 11, 16, 0.86); border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    font-family: var(--mono); font-size: 13px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--text);
  }
  .scanline { position: absolute; left: 0; right: 0; height: 90px;
              background: linear-gradient(180deg, transparent, rgba(0,224,138,.09), transparent);
              animation: camsweep 6s ease-in-out infinite; }
  @keyframes camsweep {
    0%, 100% { transform: translateY(-100px); opacity: 0; }
    20%, 80% { opacity: 1; }
    50% { transform: translateY(100%); }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="scanline" id="scan"></div>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="tag" id="tag"><span class="dot"></span> <span data-p="label">Live</span></div>
  </div>

<script src="params.js"></script>
<script>
  bindText({ label: P('label', 'Live') });
  if (P('tag', 'on') === 'off')  document.getElementById('tag').style.display = 'none';
  if (P('scan', 'on') === 'off') document.getElementById('scan').style.display = 'none';
  if (P('dot', 'rec') !== 'rec') document.querySelector('.tag .dot').className = 'dot ' + P('dot', 'rec');
</script>
</body>
</html>
